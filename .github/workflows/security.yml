name: Security checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:security
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find backend/wp-content/plugins/brounhall-headless -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Deployment artifact guard
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)(\.env[^/]*|wp-config\.php|uploads/|.*\.(sql|zip|tar\.gz|log))$' || true)
          test -z "$forbidden" || { echo "$forbidden"; exit 1; }
